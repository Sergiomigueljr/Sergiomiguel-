<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sérgio Miguel | Official Partners</title>
<meta name="description" content="Official partners and exclusive codes from Sérgio Miguel, NPC Men's Physique Athlete." />
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700;800&family=Inter:wght@400;600;700;800&display=swap');

:root {
  --gold:#d9a43a;
  --gold-light:#ffe08a;
  --gold-dark:#7a5010;
  --black:#030303;
  --white:#f8f2e8;
  --muted:#cfc8ba;
  --line:rgba(217,164,58,.75);
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  background:
    radial-gradient(circle at 50% 13%, rgba(217,164,58,.20), transparent 30%),
    radial-gradient(circle at 50% 33%, rgba(217,164,58,.08), transparent 38%),
    #000;
  color:var(--white);
  font-family:Inter, Arial, sans-serif;
}

.page {
  width:min(100%, 520px);
  margin:0 auto;
  min-height:100vh;
  padding:28px 20px 34px;
  position:relative;
  overflow:hidden;
}

.page::before {
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 52% 16%, rgba(255,213,103,.24), transparent 18%),
    radial-gradient(circle at 50% 24%, rgba(217,164,58,.16), transparent 29%),
    radial-gradient(circle at 54% 50%, rgba(217,164,58,.06), transparent 35%);
  pointer-events:none;
}

.top {
  position:relative;
  z-index:10;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  min-height:72px;
}

.logo {
  width:92px;
  display:block;
  filter: sepia(1) saturate(3.3) hue-rotate(352deg) brightness(1.08) contrast(1.12);
  mix-blend-mode: screen;
}

.hero {
  position:relative;
  z-index:2;
  height:410px;
  margin-top:-40px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.hero-smoke {
  position:absolute;
  top:28px;
  width:420px;
  height:330px;
  background:
    radial-gradient(circle, rgba(255,215,115,.30), rgba(173,110,24,.12) 39%, transparent 70%);
  filter:blur(12px);
}

.hero-smoke::after {
  content:"";
  position:absolute;
  inset:18px;
  background:
    radial-gradient(circle at 32% 52%, rgba(255,183,50,.22), transparent 22%),
    radial-gradient(circle at 70% 40%, rgba(255,205,92,.18), transparent 25%),
    radial-gradient(circle at 48% 70%, rgba(173,110,24,.18), transparent 24%);
  filter:blur(18px);
}

.hero-ring {
  position:absolute;
  top:28px;
  width:350px;
  height:350px;
  border-radius:50%;
  border:2px solid rgba(230,177,64,.82);
  box-shadow:
    0 0 36px rgba(230,177,64,.22),
    inset 0 0 28px rgba(230,177,64,.10);
}

.hero-photo {
  position:relative;
  z-index:3;
  width:390px;
  height:460px;
  object-fit:cover;
  object-position:52% 8%;
  clip-path: inset(0 0 26% 0);
  filter:contrast(1.08) saturate(1.05);
}

.title {
  position:relative;
  z-index:4;
  text-align:center;
  margin-top:-120px;
}

.title h1 {
  margin:0;
  font-family:Cinzel, serif;
  font-size:46px;
  line-height:.96;
  letter-spacing:1px;
  background:linear-gradient(180deg, #ffe9a8 0%, #d7a33c 46%, #7c5313 100%);
  -webkit-background-clip:text;
  color:transparent;
  text-shadow:0 3px 0 rgba(0,0,0,.35);
}

.title p {
  margin:13px 0 12px;
  color:#f4f1eb;
  letter-spacing:4px;
  font-size:14px;
}

.mini-divider {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
  color:var(--gold);
}

.mini-divider::before,
.mini-divider::after {
  content:"";
  width:90px;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}

.crown {
  color:var(--gold);
  font-size:24px;
  line-height:1;
}

.partners {
  position:relative;
  z-index:5;
  margin-top:24px;
}

.section-title {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin:0 0 16px;
  font-family:Cinzel, serif;
  color:var(--gold);
  font-size:18px;
  letter-spacing:1px;
}

.section-title::before,
.section-title::after {
  content:"";
  width:82px;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}

.partner {
  display:grid;
  grid-template-columns: 1.18fr 1fr 20px;
  align-items:center;
  gap:13px;
  min-height:112px;
  padding:13px 14px;
  margin:13px 0;
  text-decoration:none;
  color:var(--white);
  border:1.4px solid var(--line);
  border-radius:18px;
  background:
    linear-gradient(135deg, rgba(255,255,255,.045), transparent 35%),
    rgba(4,4,4,.80);
  box-shadow:0 0 18px rgba(217,164,58,.08), inset 0 0 22px rgba(217,164,58,.035);
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}

.partner:hover {
  transform:translateY(-2px);
  border-color:rgba(255,215,120,.95);
  box-shadow:0 0 26px rgba(217,164,58,.14), inset 0 0 22px rgba(217,164,58,.045);
}

.left {
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
}

.left img {
  width:76px;
  height:76px;
  object-fit:cover;
  border-radius:50%;
  border:1px solid rgba(217,164,58,.55);
  background:#0a0a0a;
}

.left h3 {
  margin:0;
  font-family:Bebas Neue, Inter, sans-serif;
  font-size:28px;
  letter-spacing:1px;
  line-height:1;
  color:#fff;
}

.left h3 .green {
  color:#2db540;
}

.left h3 .red {
  color:#e51d2c;
}

.left small {
  display:block;
  margin-top:5px;
  color:var(--gold);
  font-size:11px;
  text-transform:uppercase;
}

.right {
  border-left:1px solid rgba(217,164,58,.48);
  padding-left:16px;
}

.right p {
  margin:0 0 8px;
  color:var(--gold-light);
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
}

.right strong {
  display:inline-block;
  color:var(--gold-light);
  border:1px solid rgba(217,164,58,.88);
  border-radius:7px;
  padding:7px 10px;
  background:rgba(0,0,0,.36);
  font-size:13px;
  white-space:nowrap;
}

.right small {
  display:block;
  color:var(--gold);
  font-size:11px;
  margin-top:7px;
  line-height:1.35;
  text-transform:uppercase;
}

.arrow {
  color:var(--gold);
  font-size:48px;
  line-height:1;
}

footer {
  position:relative;
  z-index:4;
  margin-top:26px;
  text-align:center;
  color:var(--gold);
}

footer::before {
  content:"";
  display:block;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  margin-bottom:18px;
}

footer p {
  margin:0;
  font-size:13px;
  letter-spacing:5px;
  font-weight:600;
}

footer .crown {
  margin-top:14px;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(16px); }
  to { opacity:1; transform:translateY(0); }
}

.hero, .title, .partners, footer {
  animation:fadeUp .8s ease both;
}

.partners { animation-delay:.12s; }
footer { animation-delay:.20s; }

@media (max-width:420px) {
  .page {
    padding:22px 15px 30px;
  }

  .logo {
    width:76px;
  }

  .hero {
    height:360px;
    margin-top:-34px;
  }

  .hero-ring {
    top:24px;
    width:315px;
    height:315px;
  }

  .hero-photo {
    width:350px;
    height:420px;
    object-position:52% 8%;
  }

  .title {
    margin-top:-106px;
  }

  .title h1 {
    font-size:38px;
  }

  .title p {
    font-size:12px;
    letter-spacing:3px;
  }

  .mini-divider::before,
  .mini-divider::after {
    width:74px;
  }

  .section-title {
    font-size:16px;
  }

  .section-title::before,
  .section-title::after {
    width:60px;
  }

  .partner {
    grid-template-columns:1fr 18px;
    gap:8px;
    min-height:120px;
    padding:12px;
  }

  .left {
    gap:12px;
  }

  .left img {
    width:70px;
    height:70px;
  }

  .left h3 {
    font-size:24px;
  }

  .right {
    grid-column:1/2;
    border-left:0;
    padding-left:82px;
    margin-top:-20px;
  }

  .right p {
    font-size:12px;
    margin-bottom:6px;
  }

  .right strong {
    font-size:12px;
    padding:6px 9px;
  }

  .arrow {
    grid-column:2;
    grid-row:1/3;
    font-size:40px;
  }

  footer p {
    font-size:10px;
    letter-spacing:3px;
  }
}
</style>
</head>
